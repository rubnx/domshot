name: Feature request
description: Suggest a DOMShot improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Chrome extension
        - CLI
        - Node API
        - MCP
        - Docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like DOMShot to do?
    validations:
      required: true

